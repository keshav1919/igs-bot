<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Indo Commerce</title>
  <link rel="stylesheet" href="/static/css/dark_theme.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #111827 0%, #0b0f19 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-brand-icon {
      font-size: 38px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--accent-primary);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 8px;
      border-radius: 20px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand-icon">🛡️</span>
      <h2 style="font-size: 20px; font-weight: 700; color: #fff;">Indo Commerce Admin</h2>
      <div class="security-badge">
        <span>🔒</span> Argon2id Password Hashing Enabled
      </div>
    </div>

    {% if error %}
      <div class="alert-box alert-error" style="margin-bottom: 16px;">
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label class="form-label" for="username">Admin Username</label>
        <input class="form-control" type="text" id="username" name="username" placeholder="admin" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Admin Password</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 8px;">
        🔐 Sign In to Console
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 11px; color: var(--text-subtle);">
      Authorized Administrator Access Only &bull; Rate-Limited &amp; Monitored
    </div>
  </div>
</body>
</html>
